<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery Upload - MMU</title>

<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


</head>


<body>


<section class="upload-container">


<h2>MMU Gallery Upload</h2>


<label>Activity Title</label>

<input 
type="text" 
id="title" 
placeholder="Example: MIV Seal Replacement"
>



<label>Category</label>

<select id="category">

<option>Annual Maintenance</option>

<option>Special Maintenance</option>

<option>New Installations & Modifications</option>

<option>Major Breakdown & Restoration</option>

<option>Team Events</option>

<option>Social & External Events</option>

</select>



<label>Year (Optional)</label>

<input 
type="number" 
id="year" 
placeholder="Example: 2026"
>



<label>Description (Optional)</label>

<textarea 
id="description" 
placeholder="Short description">
</textarea>



<label>Select Photos</label>

<input 
type="file" 
id="photos" 
multiple 
accept="image/*"
>



<button onclick="uploadGallery()">

Upload

</button>


<p id="upload-message"></p>


</section>





<script>


// Check whether user is logged in

async function checkLogin(){


    const { data } = await supabaseClient.auth.getSession();


    if(!data.session){

        window.location.href = "login.html";

    }


}


checkLogin();



</script>



<script src="gallery-upload.js"></script>


</body>

</html>
