<script>
"use strict";

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUserRole = null;

let latestLoadRequest = 0;

let authStateVersion = 0;

let isUploadingDocument = false;

const documentCategories = [
    "Annual Maintenance Reports",
    "Test Reports",
    "Calibration Certificates"
];


/* =====================================================
   CHECK LOGIN STATUS
===================================================== */

async function checkLogin() {
    try {
        const {
            data: { session },
            error
        } = await supabaseClient.auth.getSession();

        if (error) {
            console.error("Unable to check login status:", error);
            updateLoginDisplay(null);
            currentUserRole = null;
            return;
        }

        updateLoginDisplay(session);

        if (session) {
            await getCurrentUserRole();
        } else {
            currentUserRole = null;
        }

    } catch (error) {
        console.error("Login check failed:", error);
        updateLoginDisplay(null);
        currentUserRole = null;
    }
}


/* =====================================================
   GET CURRENT USER ROLE
===================================================== */

async function getCurrentUserRole() {
    try {
        const {
            data,
            error
        } = await supabaseClient.rpc("get_my_role");

        if (error) {
            console.error(
                "Unable to determine user role:",
                error
            );

            currentUserRole = null;
            return;
        }

        currentUserRole = data;

    } catch (error) {
        console.error("Role check failed:", error);
        currentUserRole = null;
    }
}


/* =====================================================
   UPDATE LOGIN DISPLAY
===================================================== */

function updateLoginDisplay(session) {
    const loggedOutArea =
        document.getElementById("logged-out-area");

    const loggedInArea =
        document.getElementById("logged-in-area");

    const userEmail =
        document.getElementById("user-email");

    if (session) {
        loggedOutArea.style.display = "none";
        loggedInArea.style.display = "flex";

        userEmail.textContent =
            "👤 " + session.user.email;

    } else {
        loggedOutArea.style.display = "block";
        loggedInArea.style.display = "none";
        userEmail.textContent = "";
    }
}


/* =====================================================
   LOGIN / LOGOUT LISTENER

   Authentication changes invalidate older loading requests.
   The latest request is the only one allowed to update the
   visible document library.
===================================================== */

supabaseClient.auth.onAuthStateChange(
    (event, session) => {
        const currentVersion = ++authStateVersion;

        updateLoginDisplay(session);

        /*
         * Avoid making another Supabase authentication request
         * directly inside the authentication callback.
         */
        setTimeout(async () => {
            if (currentVersion !== authStateVersion) {
                return;
            }

            if (session) {
                await getCurrentUserRole();
            } else {
                currentUserRole = null;
            }

            if (currentVersion !== authStateVersion) {
                return;
            }

            await loadAllDocuments();

        }, 0);
    }
);


/* =====================================================
   SHOW UPLOAD FORM
===================================================== */

function showUploadForm() {
    document.getElementById("upload-panel").style.display = "block";
}


/* =====================================================
   HIDE UPLOAD FORM
===================================================== */

function hideUploadForm() {
    document.getElementById("upload-panel").style.display = "none";
}


/* =====================================================
   UPLOAD DOCUMENT
===================================================== */

async function uploadDocument() {
    if (isUploadingDocument) {
        return;
    }

    const category =
        document.getElementById("document-category").value;

    const year =
        document.getElementById("document-year").value.trim();

    const file =
        document.getElementById("document-file").files[0];

    const message =
        document.getElementById("upload-message");

    message.textContent = "";

    if (!file) {
        message.textContent = "Please select a PDF file.";
        return;
    }

    if (
        file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")
    ) {
        message.textContent = "Only PDF files are allowed.";
        return;
    }

    if (!year) {
        message.textContent = "Please enter the year.";
        return;
    }

    const {
        data: { session },
        error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError || !session) {
        message.textContent = "Please log in first.";
        return;
    }

    const safeFileName =
        file.name.replace(/[\\/]/g, "_");

    const filePath =
        category + "/" +
        year + "/" +
        Date.now() + "_" +
        safeFileName;

    isUploadingDocument = true;

    const uploadButton =
        document.querySelector(".upload-confirm-button");

    uploadButton.disabled = true;
    message.textContent = "Uploading...";

    try {
        const { error } = await supabaseClient.storage
            .from("MMU documents")
            .upload(filePath, file);

        if (error) {
            console.error("Upload error:", error);

            message.textContent =
                "Upload failed: " + error.message;

            return;
        }

        message.textContent =
            "✅ Document uploaded successfully.";

        document.getElementById("document-file").value = "";
        document.getElementById("document-year").value = "";

        await loadAllDocuments();

    } catch (error) {
        console.error("Unexpected upload error:", error);

        message.textContent =
            "Upload failed. Please try again.";

    } finally {
        isUploadingDocument = false;
        uploadButton.disabled = false;
    }
}


/* =====================================================
   LOAD ALL DOCUMENTS

   Each request gets a unique ID. Results from older requests
   are discarded. Categories are built in a detached element
   and displayed together only after the latest request ends.
===================================================== */

async function loadAllDocuments() {
    const library =
        document.getElementById("document-library");

    const requestId = ++latestLoadRequest;

    const temporaryLibrary = document.createElement("div");

    temporaryLibrary.id = "temporary-document-library";

    for (const category of documentCategories) {
        if (requestId !== latestLoadRequest) {
            return;
        }

        await loadCategory(
            category,
            temporaryLibrary,
            requestId
        );

        if (requestId !== latestLoadRequest) {
            return;
        }
    }

    if (requestId !== latestLoadRequest) {
        return;
    }

    /*
     * Replace the visible library in one operation.
     * This prevents categories from separate requests mixing.
     */
    library.replaceChildren(...temporaryLibrary.childNodes);

    if (library.children.length === 0) {
        library.innerHTML =
            '<div class="empty-message">' +
            'No documents uploaded yet.' +
            '</div>';
    }

    /*
     * Reapply the current search term after the library reloads.
     */
    applyDocumentSearch();
}


/* =====================================================
   LOAD ONE CATEGORY
===================================================== */

async function loadCategory(
    category,
    library,
    requestId
) {
    const categoryDetails =
        document.createElement("details");

    const categorySummary =
        document.createElement("summary");

    categorySummary.className = "folder-title";
    categorySummary.textContent = "📁 " + category;

    categoryDetails.appendChild(categorySummary);

    const documentsContainer =
        document.createElement("div");

    documentsContainer.className = "documents";

    categoryDetails.appendChild(documentsContainer);

    const {
        data: folders,
        error
    } = await supabaseClient.storage
        .from("MMU documents")
        .list(category, {
            sortBy: {
                column: "name",
                order: "asc"
            }
        });

    /*
     * Stop if another request has started while awaiting Supabase.
     */
    if (requestId !== latestLoadRequest) {
        return;
    }

    if (error) {
        console.error(category + " loading error:", error);

        documentsContainer.innerHTML =
            '<div class="empty-message">' +
            'Unable to load documents.' +
            '</div>';

        library.appendChild(categoryDetails);
        return;
    }

    let foundFiles = false;

    for (const folder of (folders || [])) {
        if (requestId !== latestLoadRequest) {
            return;
        }

        if (!folder.name) {
            continue;
        }

        /*
         * Ignore direct files at category level.
         * This library expects files inside year folders.
         */
        if (folder.id) {
            continue;
        }

        const year = folder.name;

        const {
            data: files,
            error: fileError
        } = await supabaseClient.storage
            .from("MMU documents")
            .list(category + "/" + year, {
                sortBy: {
                    column: "name",
                    order: "asc"
                }
            });

        if (requestId !== latestLoadRequest) {
            return;
        }

        if (fileError) {
            console.error("Folder loading error:", fileError);
            continue;
        }

        if (!files || files.length === 0) {
            continue;
        }

        /*
         * Add the year heading only if the folder contains files.
         */
        const yearHeading = document.createElement("div");

        yearHeading.className = "report-year-heading";
        yearHeading.textContent = "📂 " + year;

        documentsContainer.appendChild(yearHeading);

        for (const file of files) {
            if (requestId !== latestLoadRequest) {
                return;
            }

            if (!file.name || !file.id) {
                continue;
            }

            const filePath =
                category + "/" + year + "/" + file.name;
